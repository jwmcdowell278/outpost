# Both of these are optional - omit them entirely (or leave sender_id unset)
# and this exact file can be copied, unmodified, to every node in the mesh.
# sender_id is auto-generated on first run and cached in a sibling
# "<this file>.identity" file so it stays stable across restarts (don't copy
# that file between nodes - it's what makes each node unique). Set sender_id
# explicitly only if you need a deterministic/reproducible value.
# sender_id: 1
listen_port: 5555

# Optional human-readable name for this node, broadcast once per PTT press
# (a TYPE_START packet, symmetric with the existing once-per-release STOP
# packet) so other users see who's talking instead of just a numeric
# sender_id. Leave unset/blank for no alias. Purely a display convenience,
# not an identity guarantee - anyone holding a channel's key could claim any
# alias on it, the same as any other channel-authenticated traffic.
# sender_alias: "Basecamp"

# Shared control-plane secret used to authenticate peer-exchange (PEX) gossip
# messages (not used for audio - each channel has its own key for that).
# Every node in the mesh must share this same key. Generate with:
#   python scripts/gen_channel_key.py
mesh_key: "REPLACE_WITH_BASE64_32_BYTE_KEY"

# Each channel is a separate pre-shared key - only peers holding a channel's
# key can decrypt (and are treated as members of) that channel. Generate new
# keys with: python scripts/gen_channel_key.py
channels:
  - id: 1
    name: ops
    key: "REPLACE_WITH_BASE64_32_BYTE_KEY"
  - id: 2
    name: tac
    key: "REPLACE_WITH_BASE64_32_BYTE_KEY"

# Peer discovery: two complementary mechanisms, both optional to disable.
#  - mDNS (enable_mdns): zero-config, but only reaches multicast-capable LAN
#    segments - most VPNs and multi-hop mesh radio links won't carry it.
#    Also doesn't scale to large meshes (hundreds+ devices on one segment
#    can cause multicast storms) - disable it and rely on PEX for big
#    deployments.
#  - PEX gossip (enable_pex): each node periodically shares its known peer
#    list with the peers it already has. Works over ANY unicast-reachable
#    network (LAN, VPN mesh, multi-hop radio mesh) - a new device only needs
#    ONE reachable bootstrap peer below (or one found via mDNS) and it will
#    learn the rest of the mesh automatically, and existing devices will
#    learn about it in turn. No config changes needed on already-deployed
#    devices.
enable_mdns: true
enable_pex: true
pex_interval_s: 30

# How many of its known peers each node gossips to per round (not how many
# peers are IN the gossiped list - that is capped separately). Keeps PEX's
# control-plane traffic roughly constant per node instead of growing with
# total mesh size; full propagation still happens within a few rounds via
# hop-by-hop spread. Raise only on a small mesh for faster convergence.
pex_fanout: 8

# Safety ceiling on how many peer addresses one node will track at once
# (static + mDNS + gossiped) - limits the damage from junk addresses being
# advertised. The default covers most deployments, relay hubs included;
# raise it only for a mesh of more than about a thousand devices.
max_peers: 1024

# Auto-discovery for subnets mDNS can't reach (e.g. a WireGuard tunnel -
# point-to-point VPN links don't carry multicast) without hand-maintaining
# a peers: entry per device: periodically re-reads this node's own network
# interfaces (so a VPN/mesh interface that comes up after startup is picked
# up with no restart needed) and unicast-probes every other address on
# each interface's subnet - any other Outpost node sharing mesh_key there
# is added as a peer automatically. Off by default since it generates scan
# traffic; requires enable_pex: true (it probes via PEX). Subnets larger
# than subnet_scan_max_hosts are skipped entirely rather than partially
# scanned.
enable_subnet_scan: false
subnet_scan_interval_s: 60
subnet_scan_max_hosts: 512

# How often each node floods a tiny presence beacon per channel it holds the
# key for. Peers use this to confirm real channel membership and then target
# AUDIO/STOP sends only at confirmed members instead of every known peer -
# this is what keeps per-transmission bandwidth from growing with total mesh
# size instead of just the number of people actually on that channel. Lower
# this for faster convergence on a new channel join; raise it on a
# bandwidth-constrained mesh radio link.
channel_announce_interval_s: 60

# Automatic gain control: normalizes captured mic volume toward a target RMS
# level before encoding, so nodes with different mics/input gain don't need
# per-device manual volume tuning. Pure DSP (no model, no extra dependency).
# Disable if you'd rather control input levels yourself (e.g. a fixed-gain
# hardware mic preamp already tuned correctly).
enable_agc: true
agc_target_rms: 4000   # out of the int16 range (+/-32767); raise for a louder target level

# High-pass filter: strips DC offset and sub-audible rumble/handling noise
# below the cutoff frequency, before AGC/squelch see that energy. Pure DSP,
# on by default - rarely hurts voice quality since human speech sits well
# above typical cutoffs.
enable_highpass: true
highpass_cutoff_hz: 100   # Hz; raise toward 150-200 for heavy handling/wind noise

# Noise gate (squelch): mutes frames whose RMS stays below the threshold for
# longer than the hold time, so continuous background noise (wind, engine,
# chatter) between words isn't transmitted. Off by default - calibrate
# squelch_threshold_rms to sit between your room noise floor and your
# quietest real speech before enabling, or quiet speech may get clipped.
enable_squelch: false
squelch_threshold_rms: 300   # raise for noisier environments, lower if quiet speech gets cut off
squelch_hold_ms: 300         # how long the gate stays open after signal drops, to avoid clipping word endings

# Soft half-duplex lockout: while enabled, a new local PTT press is ignored
# if another peer's audio on the active channel was received within the last
# tx_lockout_timeout_ms (cleared immediately once that peer releases PTT).
# Best-effort only - there's no central arbiter in a P2P mesh, so two people
# keying up within one network round-trip of each other can still both get
# through. Off by default since it changes behavior (a held PTT press can
# silently not transmit) - see README's "Preventing people from talking over
# each other" section.
enable_tx_lockout: false
tx_lockout_timeout_ms: 500

# Echo guard: while enabled, mutes captured mic audio (sends silence instead
# of dropping the packet) for echo_guard_hold_ms after this device's own
# speaker last played anything. Targets acoustic feedback between two
# devices placed too close together - one device's speaker bleeding into a
# nearby device's own mic can otherwise get re-transmitted and build into a
# howling feedback loop. Off by default since it changes behavior (a held
# PTT press can go out as silence) - see README's "Preventing acoustic
# feedback between nearby devices" section.
enable_echo_guard: false
echo_guard_hold_ms: 500

# Speaks the active channel's name out loud (local text-to-speech) each time
# it changes - a hands-free convenience for operators who can't glance at a
# screen. Uses pyttsx3 (installed by default; espeak on Linux,
# NSSpeechSynthesizer on macOS - no cloud service involved). On Linux also
# install the system 'espeak' package (apt install espeak); silently does
# nothing if that's missing. Off by default. Changing this requires a
# restart (not live-editable from the web UI).
enable_channel_announce: false

# Picks a specific installed voice - case-insensitive substring matched
# against id/name/language/gender. Run `python -m outpost.announce` to list
# what's available on this machine (e.g. macOS ships "Moira", a female
# Irish English voice, built in). Named voices aren't portable across
# platforms - espeak's Linux voices aren't individually named, so use the
# portable "female"/"male" there instead. Leave unset to use the system
# default voice.
channel_announce_voice:

# Multicast within a site (one batman-adv mesh or LAN): a talker sends each
# voice frame once to the channel's multicast group instead of one copy per
# listener - what makes a large channel workable on mesh Wi-Fi. Listeners
# reached by multicast get no unicast copy; everyone else (VPN peers, nodes
# with this off) still gets unicast. Channels with fewer than
# multicast_min_listeners listeners on this site stay unicast. On by default
# and safe to leave on everywhere: a channel only switches to multicast once
# that many listeners have actually been heard by multicast, so on networks
# where it doesn't get through (VPN, routed links) nothing changes. The mesh
# interface is found automatically (bat0, or the bridge such as br-lan it's
# in); set multicast_interface only to override that. See README "Large
# channels on a mesh site".
enable_multicast: true
# For a site bridge (enable_relay: true on a node that's on both the site and
# the VPN): the subnet(s) of its own site. Unset, it's taken from
# multicast_interface. See README "Bridging sites".
# site_subnets: [10.1.0.0/24]
# Several bridges on one site (same uplink for redundancy, or different
# uplinks): for each outside neighbour the highest-priority bridge reaching
# it (0-255, then lowest sender_id) forwards; another takes over after 3
# hello intervals of silence. See README "Redundant bridges and mixed uplinks".
# bridge_priority: 100
# bridge_hello_interval_s: 2.0
# multicast_interface: bat0
# multicast_group_base: 239.192.77.0   # groups are this + channel id (+0 for announces)
# multicast_port: 5556
multicast_min_listeners: 5

# Channels to listen to besides the one you talk on (the active channel) -
# e.g. a team member on their team channel who also monitors "main". Audio
# from all of them is mixed. channel_volumes sets each channel's level
# (0.0-1.0, default 1.0); with duck_monitored_channels, monitored channels are
# turned down while someone talks on your active channel. All of these can
# also be changed live from the web UI's Status page.
# monitor_channels: [main]
# channel_volumes: {main: 0.6}

# Hardware buttons (Bluetooth PTT buttons, USB footswitches, media keys...)
# and what they do: ptt, ptt_toggle, volume_up, volume_down, channel_up,
# channel_down. Easiest to set up from the web UI's Buttons page (press the
# button and it's recorded). Linux only. device is the input device's name;
# leave it out to accept that key from any device. See README "Hardware
# buttons".
# button_bindings:
#   - {key: KEY_F13, action: ptt, device: INRICO B01}
#   - {key: KEY_VOLUMEUP, action: volume_up}
duck_monitored_channels: true

# Which microphone / speaker to use when this node has more than one (e.g. a
# USB headset plus a built-in mic). Run `python -m outpost.audio` to list
# this machine's devices. Use part of the device name (case-insensitive,
# e.g. "USB") rather than its [index] where possible - indices can change
# when USB devices are replugged or the machine reboots. Leave unset to use
# the system default. If nothing matches, a warning is logged and the system
# default is used. Can also be picked from the web UI's Settings page.
# Changes take effect after a restart.
# input_device: "USB Audio"
# output_device: "USB Audio"

# Bluetooth headsets in hands-free mode (see README "Raspberry Pi with a
# Bluetooth headset"): open the speaker only when there's something to play
# and the mic only while PTT is held, so the headset's audio link isn't
# running constantly. The link takes up to a second to come up when you
# press PTT - talk_permit_tone beeps once the mic is live (not transmitted).
# release_audio_when_idle: false
# talk_permit_tone: false
# Reconnect paired, trusted Bluetooth devices that aren't connected (every
# 15 s) - for headsets that don't reconnect by themselves. Linux only.
# bluetooth_auto_reconnect: true

# Rotating file logging, in addition to scripts/run_client.py's console
# output - off by default (unset). Set log_file to also archive logs to
# disk for diagnosing intermittent issues after the fact (easy to lose
# console scrollback on a long-running headless device). Rotates purely by
# size: once a file reaches log_max_bytes it's rolled over and a fresh one
# started, and once log_backup_count rolled-over files exist, the oldest is
# deleted - total disk usage stays bounded at roughly
# log_max_bytes * (log_backup_count + 1) however long the process runs.
# Always captures full DEBUG-level detail regardless of --verbose. Can also
# be set/overridden per-run with --log-file without editing this file.
# log_file: /var/log/outpost/outpost.log
# log_max_bytes: 10000000   # 10MB per file
# log_backup_count: 5       # keep 5 rolled-over files (~60MB total at defaults)

# Lightweight local web UI (view status, switch channels, web-based PTT) -
# off by default. Requires the 'web' extra: pip install -e ".[web]".
# Binds to loopback (127.0.0.1) by default; if you change web_ui_host to
# anything reachable by others, set web_ui_token too, since the control
# endpoints are otherwise unauthenticated.
enable_web_ui: false
# web_ui_host: 127.0.0.1
# web_ui_port: 8765
# web_ui_token: some-shared-secret

# Relay/bridge mode: blind-floods AUDIO/STOP/CHANNEL_ANNOUNCE packets to
# every other known peer, keyed only on the cleartext header - no channel
# key needed. Only set this on a node meant to bridge two otherwise-
# unreachable peer groups (e.g. a local batman-adv mesh segment and a
# WireGuard-connected HQ/uplink segment) - see README's "Relay / bridge
# mode" section. Off by default; most nodes are plain clients.
enable_relay: false
# A machine that should ONLY relay (a server, e.g. your WireGuard server, with
# no mic/speaker/PTT) can set relay_only: true instead - no channels needed.
# See config/relay.example.yaml and README "Running a relay on a server".
# relay_only: false

# Only needed to seed PEX on a link mDNS can't reach (VPN/mesh radio) - a
# single reachable peer is enough for the rest to be learned via gossip.
peers: []
#  - host: 10.0.0.2
#    port: 5555

# Network-profile knobs - defaults suit a normal LAN/VPN. For constrained
# mesh radio links (e.g. LoRa), lower bitrate/max_packet_bytes and raise
# frame_ms to cut airtime per voice-second; inband_fec helps recover single
# lost frames on lossy links at the cost of a bit more bandwidth.
bitrate: 16000           # bits/sec, e.g. 6000-8000 for very constrained radio links
frame_ms: 20             # 20-60ms; larger frames mean fewer, bigger packets
max_packet_bytes: 1200   # lower for small-MTU radio links (e.g. 200 for LoRa)
inband_fec: true

# Makes every voice packet the same size, so someone watching the network
# can't infer what's being said from packet lengths (Opus frame sizes
# otherwise follow the speech). Each frame is capped at the bitrate above and
# padded up to it, so while transmitting you use a steady `bitrate`. Only
# turn off on links where every byte counts and that leak is acceptable.
constant_size_audio: true

