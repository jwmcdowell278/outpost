# Heltec HT-HC01P: Heltec's board config file for driver 1.15.3 - it must
# match the module version (printed on it): bcf_HC01P-V2.bin for "V2",
# bcf_HC0P.bin for the original. The wrong one leaves the radio nearly deaf
# and mute. After changing it, reload the driver (README "Board config
# file"). And the regulatory country - keep it the same as COUNTRY in
# /etc/halow-mesh/halow.env.
# spi_clock_speed: on a Pi 3 with this HAT, 25 MHz+ always fails during
# firmware upload and 10 MHz fails ~1 load in 4; 5 MHz loaded 8/8. Still
# far more than push-to-talk voice needs.
options morse bcf=bcf_HC01P-V2.bin country=US spi_clock_speed=5000000
# Don't auto-load at early boot (a stuck chip could stall udev and the whole
# boot); halow-mesh.service loads it later with a time limit.
blacklist morse
