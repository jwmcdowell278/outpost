services:
  outpost:
    build: .
    # host networking is the recommended default: Outpost relies on mDNS
    # multicast and raw peer-to-peer UDP, both of which bridge/NAT networking
    # complicates or breaks outright (see README's "Running with Docker").
    network_mode: host
    volumes:
      - ./config:/config:ro
    # Device passthrough only works on a real Linux host (e.g. a Raspberry
    # Pi) - Docker Desktop on macOS/Windows runs containers in a VM with no
    # host audio/GPIO/USB/serial devices to pass through, so this whole
    # section is commented out by default; uncomment what you need when
    # deploying to Linux (list ALSA devices with `aplay -L`/`arecord -L`).
    # devices:
    #   - /dev/snd:/dev/snd                # microphone/speaker
    #   - /dev/gpiomem:/dev/gpiomem        # --ptt gpio (Raspberry Pi)
    #   - /dev/ttyUSB0:/dev/ttyUSB0        # --ptt serial
    #   - /dev/bus/usb:/dev/bus/usb        # --ptt hid
    command:
      - --config=/config/outpost.yaml
      - --channel=ops
      - --ptt=gpio
      - --gpio-pin=17
    restart: unless-stopped
