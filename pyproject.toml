[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outpost"
version = "0.1.0"
description = "Encrypted, low-bitrate, multi-channel push-to-talk voice over IP"
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "opuslib>=3.0.1",
    "PyNaCl>=1.5.0",
    "PyYAML>=6.0",
    "pynput>=1.7.6",
    "zeroconf>=0.132.0",
    "ifaddr>=0.2.0",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
hardware = ["hidapi>=0.14.0", "pyserial>=3.5", "gpiozero>=2.0"]
dev = ["pytest>=8.0", "aiohttp>=3.9"]
# Needed only for the optional local web UI (outpost/webui.py) - status view
# and remote channel/PTT control. Not required otherwise.
web = ["aiohttp>=3.9"]

[tool.setuptools.packages.find]
include = ["outpost*"]
